services:
  # 1. База даних з підтримкою векторів
  db:
    image: pgvector/pgvector:pg16 # Змінили на образ із pgvector
    container_name: sail-db
    environment:
      POSTGRES_DB: sail_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d sail_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Твій основний .NET API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sail-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # ВАЖЛИВО: Host=db (назва сервісу в мережі Docker)
      - DB_CONNECTION_LOCAL=Host=db;Database=sail_db;Username=postgres;Password=password
      - AI_SERVICE_URL=http://ai-service:8000 # Посилання на Python сервіс
      - AllowedOrigins=http://localhost:3000
      - JWT__Issuer=YOUR_JWT_ISSUER
      - JWT__Audience=YOUR_JWT_AUDIENCE
      - JWT__SigningKey=YOUR_JWT_KEY
      - SMTP_HOST=SMTP_HOST
      - SMTP_PORT=PORT
      - SMTP_USER=EMAIL
      - SMTP_PASS=PASSWORD
      - FEEDBACK_RECIPIENT_EMAIL=EMAIL
      - RESEND_API_KEY=YOUR_RESEND_API_KEY
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./local_uploads:/app/wwwroot

  # 3. Твій НОВИЙ Python AI-сервіс
  ai-service:
    build:
      context: ./ai # Шлях до папки з Python кодом
      dockerfile: Dockerfile
    container_name: sail-ai
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/sail_db
      - OPENROUTER_API_KEY=your_key_here
      - OLLAMA_API_BASE=http://host.docker.internal:11434/v1
      - MAIN_API_URL=http://api:8080
      - _JAVA_OPTIONS=-Xms64m -Xmx384m -XX:+UseSerialGC
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # 4. React Фронтенд
  frontend:
    image: node:22-alpine
    container_name: sail-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - WDS_SOCKET_PORT=0
      - REACT_APP_BASE_URL=http://localhost:8080
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start"
    depends_on:
      - api
volumes:
  postgres_data:
  local_uploads:
